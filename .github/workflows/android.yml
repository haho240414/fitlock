name: 안드로이드 앱 (APK)

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
    paths: ['app/**', 'android/**', 'test/**', 'tools/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  test:
    name: 단위 테스트 (웹·센서 세기)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 폰 들고 세기 채점 (가짜 센서 시나리오)
        run: node tools/motion-eval.mjs --seeds 3

  build:
    name: APK 빌드 + 네이티브 단위 테스트
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 웹 앱 → 안드로이드 프로젝트로 복사
        run: |
          npm ci
          npx cap sync android
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::서명 키 비밀값이 없어 서명 안 된 릴리스가 만들어집니다"
          fi
      - name: 빌드 (잠금 판단 단위 테스트 + 릴리스 + 점검용 디버그)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/fitlock.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/fitlock-debug.apk
          ls -la ../dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-report
          path: android/app/build/reports/tests
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk

  smoke:
    name: 에뮬레이터 점검 (안드로이드 ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist
      - name: KVM 가속 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 화면 끄기·켜기 → 잠금 위 운동 화면 → 스쿼트(가짜 센서) → 열림 → 건너뛰기·전화·카메라
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back none
          script: bash .github/scripts/android-smoke.sh dist/fitlock-debug.apk smoke-out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-result-api${{ matrix.api }}
          path: smoke-out

  release:
    name: 다운로드 링크 갱신 (Releases)
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION_NAME}" dist/fitlock.apk \
            --repo "${{ github.repository }}" --latest \
            --title "핏락 ${VERSION_NAME}" \
            --notes "안드로이드 폰에서 fitlock.apk 를 받아 설치하세요. (설정에서 '출처를 알 수 없는 앱 설치'를 허용해야 해요. 안드로이드 15 이상은 앱 정보 → ⋮ → '제한된 설정 허용' 후 '다른 앱 위에 표시'를 켜 주세요)"
